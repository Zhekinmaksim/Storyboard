[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storyboard"
version = "0.1.0"
description = "Hermes Agent skill: prose to Dry Ink film storyboards with Kimi K2.5 multimodal critique."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Zmaxx", email = "zhekinmaksim@users.noreply.github.com" }]
requires-python = ">=3.10"
keywords = ["hermes", "kimi", "storyboard", "svg", "film", "agent", "openrouter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-mock>=3.10", "ruff>=0.5"]

[project.scripts]
storyboard = "scripts.storyboard:main"

[project.urls]
Homepage = "https://github.com/Zhekinmaksim/storyboard"
Issues = "https://github.com/Zhekinmaksim/storyboard/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
