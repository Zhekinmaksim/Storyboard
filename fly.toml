# fly.toml — storyboard API
#
# Deploy with:
#   flyctl secrets set OPENROUTER_API_KEY=sk-or-...
#   flyctl deploy
#
# DNS:
#   1. flyctl ips list                            (note v4 + v6)
#   2. CNAME api.hermes-story.art → <app>.fly.dev
#   3. flyctl certs add api.hermes-story.art
#

app = 'storyboard-api-billowing-shell-4189'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'
  STORYBOARD_ALLOWED_ORIGINS = 'https://hermes-story.art,https://www.hermes-story.art'
  STORYBOARD_JOB_TTL = '1800'
  STORYBOARD_MAX_JOBS = '30'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0      # scale to zero when idle
  processes = ['app']

  # SSE-friendly: long timeouts, no buffering
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 25
    hard_limit = 50

  # Health check
  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

# 512MB shared CPU is plenty — pipeline is I/O bound on Kimi calls.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
